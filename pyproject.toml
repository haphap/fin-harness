[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-harness"
version = "0.1.0"
description = "Deterministic, point-in-time financial analysis harness for agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "fin-harness contributors"}]
dependencies = []

[project.urls]
Repository = "https://github.com/haphap/fin-harness"
Issues = "https://github.com/haphap/fin-harness/issues"

[project.scripts]
fin-harness = "fin_harness.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/fin-harness/registry/metrics" = ["registry/metrics/*.json"]
"share/fin-harness/protocol/v1" = ["protocol/v1/*.schema.json"]
"share/fin-harness/protocol/v1/fixtures" = ["protocol/v1/fixtures/*.json"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
]
